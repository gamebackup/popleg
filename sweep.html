<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Poptropica room sweep</title>
<style>
    body { margin: 24px; font: 13px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
           color: #d8e6f3; background: #0b1a2a; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    pre { margin: 0; white-space: pre-wrap; }
    .bad { color: #ffb4a8; }
</style>
</head>
<body>
<h1>Poptropica room sweep</h1>
<pre id="status">waiting…</pre>
<script>
/*
    Runs tools/pop-scenes.js in small chunks, then reloads the page. A room boots a
    whole Ruffle instance, and the browser does not give all of that memory back
    promptly; reloading keeps a long sweep from exhausting the tab.

    Open /sweep.html?run=1 for a full pass, /sweep.html?retry=1&run=1 to recheck
    the last full sweep's noScene rows, or /sweep.html?retry=2&run=1 to recheck
    the noScene rows left by retry 1. Progress is the same localStorage entry the
    console tool uses, so this resumes wherever a previous run stopped. A lock
    stops a second tab from running the same sweep.

    One chunk is CHUNK rooms, probed up to CHUNK at a time. Three Ruffle instances
    at once is the default speed/memory trade-off; lower it if the tab gets heavy.
*/
(async () => {
    const CHUNK = 3;
    const MAX_RUNS = 1000;
    const params = new URLSearchParams(location.search);
    const retryPass = parseInt(params.get("retry"), 10) || 0;
    const retry = retryPass > 0;
    const retrySuffix = retryPass > 1 ? "retry" + retryPass : "retry";
    const KEY = retry ? "pop-scenes-" + retrySuffix + ":/" : "pop-scenes:/";
    const LOCK = retry ? "pop-scenes-" + retrySuffix + "-lock" : "pop-scenes-lock";
    const RUNS = retry ? "pop-scenes-" + retrySuffix + "-runs" : "pop-scenes-runs";
    const SUMMARY = retry ? "pop-scenes-" + retrySuffix + "-summary" : "pop-scenes-summary";
    const status = document.getElementById("status");
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    const say = text => { status.textContent = text; };

    function rows() {
        try {
            const saved = JSON.parse(localStorage.getItem(KEY) || "null");
            return saved && Array.isArray(saved.rows) ? saved.rows : [];
        } catch (err) { return []; }
    }

    if (params.get("run") !== "1") {
        say("Add ?run=1 to the URL to start.\nSaved rooms: " + rows().length);
        return;
    }

    let retryRooms = null;

    if (retry) {
        const sourceSummary = retryPass === 1 ? "pop-scenes-summary"
                            : retryPass === 2 ? "pop-scenes-retry-summary"
                            : "pop-scenes-retry" + (retryPass - 1) + "-summary";

        let original = null;
        try { original = JSON.parse(localStorage.getItem(sourceSummary) || "null"); } catch (err) { }

        if (!original || !Array.isArray(original.noScene)) {
            say("Retry " + retryPass + " needs " + sourceSummary + " with a noScene list.");
            return;
        }

        retryRooms = original.noScene.filter(function (key) {
            const room = String(key).split("/").pop() || "";
            return !/^(AdGround|AdSky|AdUnder)/i.test(room);
        });

        if (!retryRooms.length) {
            say("No unverified rooms left for retry " + retryPass + ".");
            return;
        }

        window.__popScenesRoomList = retryRooms;
        window.__popScenesKey = KEY;
    }

    const done = localStorage.getItem(SUMMARY);
    if (done) {
        say((retry ? "Retry " + retryPass + " already finished." : "Sweep already finished.") + "\n\n" + done);
        return;
    }

    const before = rows();
    const runs = (parseInt(localStorage.getItem(RUNS), 10) || 0) + 1;
    localStorage.setItem(RUNS, String(runs));

    if (runs > MAX_RUNS) {
        say("Stopped after " + MAX_RUNS + " reloads. " + before.length + " rooms saved.\n" +
            "Open a fresh tab with ?run=1 after checking the page.");
        return;
    }

    // Claim the sweep. A second tab that opens at the same moment will lose the
    // owner check below instead of starting a competing iframe.
    const owner = Date.now() + ":" + Math.random().toString(36).slice(2);
    localStorage.setItem(LOCK, JSON.stringify({ owner: owner, at: Date.now() }));

    await sleep(150);

    let lock = null;
    try { lock = JSON.parse(localStorage.getItem(LOCK) || "null"); } catch (err) { }
    if (!lock || lock.owner !== owner) {
        say("Another sweep tab owns the lock; this one is idle.");
        return;
    }

    const heartbeat = setInterval(() => {
        localStorage.setItem(LOCK, JSON.stringify({ owner: owner, at: Date.now() }));
    }, 5000);

    function release() {
        clearInterval(heartbeat);
        try {
            const now = JSON.parse(localStorage.getItem(LOCK) || "null");
            if (!now || now.owner === owner) localStorage.removeItem(LOCK);
        } catch (err) { }
    }

    window.addEventListener("pagehide", release);

    window.__popScenesChunk = 2;
    window.__popScenesRooms = CHUNK;
    window.__popScenesParallel = CHUNK;

    say((retry ? "retry " + retryPass : "run") + " " + runs + " · " + before.length +
        (retry ? "/" + retryRooms.length : " rooms already saved") +
        " · probing " + CHUNK + " more, " + CHUNK + " at a time");

    let result;

    try {
        result = await fetch("tools/pop-scenes.js", { cache: "no-cache" })
            .then(r => { if (!r.ok) throw new Error(r.status + " tools/pop-scenes.js"); return r.text(); })
            .then(eval);
    } catch (err) {
        release();
        say("Sweep error after " + before.length + " saved rooms:\n" + (err && err.message || err));
        return;
    }

    release();

    const after = rows();

    if (result && result.rooms) {
        localStorage.setItem(SUMMARY, JSON.stringify(result, null, 1));
        try { localStorage.removeItem(RUNS); } catch (err) { }
        say((retry ? "Retry " + retryPass + " finished: " : "Finished: ") + result.rooms + " rooms · ok " + result.ok +
            " · failed " + result.failed.length + " · no scene " + result.noScene.length +
            " · wrong scene " + result.wrong.length + "\n\n" + JSON.stringify(result, null, 1));
        return;
    }

    // A shrinking row set is the ad-clip filter dropping rows saved by older runs,
    // not a wedge; only an unchanged set means this run added nothing.
    if (after.length === before.length && after.length) {
        say("No progress this run (" + after.length + " saved). Stopping instead of reloading.\n" +
            "The last room may have wedged the page; reload once and retry.");
        return;
    }

    say("run " + runs + " done · " + after.length + " rooms saved · reloading to release memory");
    await sleep(10000);
    location.reload();
})();
</script>
</body>
</html>
